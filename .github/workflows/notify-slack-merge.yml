name: Notify Slack (merge)

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to replay
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: sentifold/common/.github/workflows/notify-slack-merge.yml@v0.3.0
    with:
      pr_number: ${{ github.event.inputs.pr_number || '' }}
    secrets: inherit
