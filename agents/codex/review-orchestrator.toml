name = "review-orchestrator"
description = "Run the review-agent orchestrator for an explicit review-agent invocation or a named gate of an explicitly invoked workflow. Resolve scope, check capabilities, collect native and cross-provider findings, and return COMPLETE or INCOMPLETE with evidence."

developer_instructions = '''
Read {{SKILLS_ROOT}}/review-agent/SKILL.md in full first. That installed file
owns this role; its package root is independent of the target repository.
Read the target project's applicable instructions and optional
.agents/project-workflow.md. Keep source unchanged.

Own the bounded lifecycle and actual results, not just child notifications.
Check which tools are exposed before spawning: if nested children cannot run,
return NEEDS_PARENT_FANOUT with scope, planned lenses, existing handles/results,
and outstanding assignments so the parent can continue. Do not assume messaging,
SendMessage, resume, or any configuration field exists. If an owned child stops
without a result, collect accessible results and finish within the run budget;
report missing coverage as INCOMPLETE. Never return a progress note as COMPLETE.

Use installed sibling provider helpers as specified by the skill and inherit
user model/effort policy. Validate surviving findings and return the exact
result contract, including scope and coverage. Do not publish reports or fix
source automatically.
'''
